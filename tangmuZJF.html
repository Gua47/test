<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="google" content="notranslate">
    <title>汤姆猫文言文跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            /* 采用系统级安全字体 */
            font-family: 'PingFang SC', 'Microsoft YaHei', 'STKaiti', 'KaiTi', sans-serif;
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #gameContainer {
            width: 900px;
            height: 600px;
            position: relative;
            background: #16213e;
            border: 4px solid #e94560;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.3);
            /* 设定缩放基准点为中心 */
            transform-origin: center center;
        }
        
        /* 汤姆猫样式 */
        .tom-cat {
            width: 60px;
            height: 80px;
            position: absolute;
            left: 100px;
            bottom: 120px;
            z-index: 10;
            transition: bottom 0.3s ease;
        }
        
        .tom-body {
            width: 50px;
            height: 55px;
            background: #4a90d9;
            border-radius: 25px 25px 20px 20px;
            position: absolute;
            left: 5px;
            top: 20px;
            border: 2px solid #2c5a8a;
        }
        
        .tom-head {
            width: 40px;
            height: 35px;
            background: #4a90d9;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 0;
            border: 2px solid #2c5a8a;
        }
        
        .tom-ear { width: 12px; height: 16px; background: #4a90d9; border-radius: 50% 50% 0 0; position: absolute; top: -8px; border: 2px solid #2c5a8a; }
        .tom-ear.left { left: 8px; transform: rotate(-20deg); }
        .tom-ear.right { right: 8px; transform: rotate(20deg); }
        
        .tom-eye { width: 10px; height: 12px; background: white; border-radius: 50%; position: absolute; top: 8px; border: 1px solid #2c5a8a; }
        .tom-eye.left { left: 6px; }
        .tom-eye.right { right: 6px; }
        .tom-pupil { width: 5px; height: 6px; background: #1a1a2e; border-radius: 50%; position: absolute; top: 3px; left: 2px; }
        
        .tom-nose { width: 6px; height: 4px; background: #ff6b8a; border-radius: 50%; position: absolute; top: 18px; left: 17px; }
        .tom-mouth { width: 16px; height: 6px; border: 2px solid #2c5a8a; border-top: none; border-radius: 0 0 10px 10px; position: absolute; top: 22px; left: 12px; }
        
        .tom-whisker { width: 12px; height: 1px; background: #2c5a8a; position: absolute; top: 18px; }
        .tom-whisker.left1 { left: -8px; top: 16px; }
        .tom-whisker.left2 { left: -8px; top: 20px; }
        .tom-whisker.right1 { right: -8px; top: 16px; }
        .tom-whisker.right2 { right: -8px; top: 20px; }
        
        .tom-leg { width: 14px; height: 20px; background: #4a90d9; border-radius: 0 0 7px 7px; position: absolute; bottom: -18px; border: 2px solid #2c5a8a; border-top: none; }
        .tom-leg.left { left: 8px; }
        .tom-leg.right { right: 8px; }
        
        .tom-tail { width: 8px; height: 25px; background: #4a90d9; border-radius: 0 0 4px 4px; position: absolute; right: -6px; top: 30px; transform: rotate(-30deg); border: 2px solid #2c5a8a; }
        .tom-belly { width: 30px; height: 25px; background: #87ceeb; border-radius: 50%; position: absolute; left: 10px; top: 35px; }
        
        /* 跑步动画 */
        @keyframes run { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        .running .tom-leg.left { animation: run 0.3s infinite; }
        .running .tom-leg.right { animation: run 0.3s infinite reverse; }
        .running .tom-tail { animation: run 0.2s infinite; }
        
        .jumping { bottom: 280px !important; }
        
        /* 场景元素 */
        .ground { width: 100%; height: 120px; background: #0f3460; position: absolute; bottom: 0; border-top: 3px solid #e94560; }
        .ground-line { width: 100%; height: 3px; background: #e94560; position: absolute; top: 0; opacity: 0.5; }
        
        .obstacle { width: 40px; height: 50px; background: #e94560; position: absolute; bottom: 120px; border-radius: 5px 5px 0 0; border: 2px solid #c73e54; }
        .obstacle::before { content: '❌'; position: absolute; top: 10px; left: 8px; font-size: 20px; }
        
        .coin { width: 30px; height: 30px; background: #ffd700; border-radius: 50%; position: absolute; bottom: 200px; border: 3px solid #ffaa00; box-shadow: 0 0 10px #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #b8860b; font-size: 14px; }
        .coin::after { content: '文'; }
        
        .bg-building { width: 80px; height: 200px; background: #1a1a2e; position: absolute; bottom: 120px; border: 2px solid #0f3460; opacity: 0.6; }
        .bg-building::before { content: ''; width: 60px; height: 60px; background: #16213e; position: absolute; top: 20px; left: 8px; border: 1px solid #0f3460; }
        
        /* UI 面板 */
        #quizPanel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 600px; background: rgba(22, 33, 62, 0.98); border: 3px solid #e94560; border-radius: 15px; padding: 25px; z-index: 100; display: none; box-shadow: 0 0 30px rgba(233, 69, 96, 0.5); }
        #quizPanel.active { display: block; }
        
        .quiz-title { color: #e94560; font-size: 22px; text-align: center; margin-bottom: 15px; font-weight: bold; }
        .quiz-question { color: #eaeaea; font-size: 18px; line-height: 1.6; margin-bottom: 20px; text-align: center; }
        .quiz-input { width: 100%; padding: 12px; font-size: 18px; background: #0f3460; border: 2px solid #4a90d9; border-radius: 10px; color: #eaeaea; text-align: center; font-family: inherit; outline: none; }
        .quiz-input:focus { border-color: #e94560; box-shadow: 0 0 15px rgba(233, 69, 96, 0.4); }
        .quiz-btn { width: 100%; padding: 12px; margin-top: 15px; background: #e94560; border: none; border-radius: 10px; color: white; font-size: 18px; cursor: pointer; font-weight: bold; font-family: inherit; transition: all 0.3s; }
        .quiz-btn:hover { background: #ff6b8a; transform: scale(1.02); }
        .quiz-hint { color: #87ceeb; font-size: 14px; text-align: center; margin-top: 10px; }
        
        #topBar { position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.6); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 50; color: #ffd700; font-size: 16px; font-weight: bold; }
        .info-item { display: flex; align-items: center; gap: 5px; }
        .info-label { color: #87ceeb; }
        
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #16213e; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        .start-title { font-size: 40px; color: #e94560; margin-bottom: 15px; text-shadow: 0 0 20px rgba(233, 69, 96, 0.5); font-weight: bold; text-align: center; }
        .start-subtitle { font-size: 20px; color: #87ceeb; margin-bottom: 30px; text-align: center; }
        .start-btn { padding: 15px 50px; font-size: 22px; background: #e94560; border: none; border-radius: 15px; color: white; cursor: pointer; font-family: inherit; font-weight: bold; transition: all 0.3s; box-shadow: 0 0 20px rgba(233, 69, 96, 0.4); }
        .start-btn:hover { background: #ff6b8a; transform: scale(1.05); }
        .start-instructions { margin-top: 25px; color: #ddd; font-size: 16px; text-align: center; line-height: 1.8; }
        
        #resultScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        .result-title { font-size: 36px; margin-bottom: 15px; font-weight: bold; }
        .result-title.win { color: #ffd700; }
        .result-title.lose { color: #e94560; }
        .result-score { font-size: 24px; color: #87ceeb; margin-bottom: 25px; }
        .result-detail { color: #ddd; font-size: 16px; margin-bottom: 25px; text-align: center; max-width: 80%; line-height: 1.8; }
        
        .error-shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        .correct-glow { animation: glow 0.5s ease-in-out; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 0 transparent; } 50% { box-shadow: 0 0 30px #ffd700; } }
        
        .level-badge { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: #e94560; color: white; padding: 8px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; z-index: 40; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        .level-badge.show { opacity: 1; }
        
        .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 60; }
        
        .lives { display: flex; gap: 5px; }
        .life { font-size: 20px; color: #e94560; }
        .life.lost { opacity: 0.3; }
        
        .scrolling-bg { position: absolute; bottom: 120px; left: 0; width: 200%; height: 200px; display: flex; z-index: 1; }
        .scrolling-bg-inner { width: 50%; height: 100%; display: flex; justify-content: space-around; align-items: flex-end; }
        #gameObjects { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="topBar">
            <div class="info-item"><span class="info-label">关卡:</span><span id="levelText">项脊轩志</span></div>
            <div class="info-item"><span class="info-label">题目:</span><span id="questionNum">1/10</span></div>
            <div class="info-item"><span class="info-label">金币:</span><span id="coinCount">0</span></div>
            <div class="info-item lives" id="livesContainer">
                <span class="life">❤</span><span class="life">❤</span><span class="life">❤</span>
            </div>
        </div>
        
        <div class="level-badge" id="levelBadge">第一关：项脊轩志</div>
        
        <div class="scrolling-bg" id="scrollingBg">
            <div class="scrolling-bg-inner" id="bgInner1"></div>
            <div class="scrolling-bg-inner" id="bgInner2"></div>
        </div>
        
        <div class="ground"><div class="ground-line"></div></div>
        
        <div class="tom-cat" id="tomCat">
            <div class="tom-ear left"></div><div class="tom-ear right"></div>
            <div class="tom-head">
                <div class="tom-eye left"><div class="tom-pupil"></div></div>
                <div class="tom-eye right"><div class="tom-pupil"></div></div>
                <div class="tom-nose"></div><div class="tom-mouth"></div>
                <div class="tom-whisker left1"></div><div class="tom-whisker left2"></div>
                <div class="tom-whisker right1"></div><div class="tom-whisker right2"></div>
            </div>
            <div class="tom-body"><div class="tom-belly"></div></div>
            <div class="tom-leg left"></div><div class="tom-leg right"></div>
            <div class="tom-tail"></div>
        </div>
        
        <div id="gameObjects"></div>
        
        <div id="quizPanel">
            <div class="quiz-title" id="quizTitle">项脊轩志 · 理解性默写</div>
            <div class="quiz-question" id="quizQuestion">题目加载中...</div>
            <input type="text" class="quiz-input" id="quizInput" placeholder="请手写输入答案" autocomplete="off">
            <button class="quiz-btn" id="submitBtn">提交答案</button>
            <div class="quiz-hint" id="quizHint">提示：注意字词正确</div>
        </div>
        
        <div id="startScreen">
            <div class="start-title">🐱 汤姆猫文言文跑酷</div>
            <div class="start-subtitle">高中必背文言文默写挑战</div>
            <button class="start-btn" id="startBtn">开始游戏</button>
            <div class="start-instructions">
                📖 第一关：《项脊轩志》10题<br>
                📖 第二关：《陈情表》10题<br>
                ✍️ 答对题目，汤姆猫起跑拾取金币<br>
                ❌ 答错3次更换题目，撞到障碍失去生命
            </div>
        </div>
        
        <div id="resultScreen">
            <div class="result-title" id="resultTitle">游戏结束</div>
            <div class="result-score" id="resultScore">得分：0</div>
            <div class="result-detail" id="resultDetail"></div>
            <button class="start-btn" id="restartBtn" style="padding: 15px 40px; font-size: 18px;">重新开始</button>
        </div>
    </div>

    <script>
    // 使用 DOMContentLoaded 确保网页所有节点加载完毕后再执行 JavaScript
    // 彻底解决由于刷新导致的加载中断白屏/蓝屏问题
    document.addEventListener('DOMContentLoaded', () => {
        
        // ==================== 屏幕自适应缩放逻辑（解决手机端看不到文字的问题） ====================
        function resizeGame() {
            const container = document.getElementById('gameContainer');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            // 计算缩放比例，留出一点边距（90%）
            const scaleX = (windowWidth * 0.95) / 900;
            const scaleY = (windowHeight * 0.95) / 600;
            const scale = Math.min(scaleX, scaleY, 1); // 限制最大比例为1（不在大屏上过度放大）
            
            container.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', resizeGame);
        resizeGame(); // 初始化调用一次

        // ==================== 游戏数据 ====================
        const xiangJiXuanQuestions = [
            { question: "《项脊轩志》中，描写项脊轩的大小和面积的句子是：________，________。", answer: ["室仅方丈", "可容一人居"], keywords: ["室仅方丈", "可容一人居"], hint: "注意'方丈'不是寺庙主持的意思" },
            { question: "《项脊轩志》中，描写'百年老屋'项脊轩在修葺之前旧、破的句子是：________，________。", answer: ["尘泥渗漉", "雨泽下注"], keywords: ["尘泥渗漉", "雨泽下注"], hint: "注意'渗漉'二字的写法" },
            { question: "《项脊轩志》中，描写了北向的项脊轩修葺之前采光不好的情况的句子是：________，________。", answer: ["不能得日", "日过午已昏"], keywords: ["不能得日", "日过午已昏"], hint: "注意'已昏'的'已'" },
            { question: "《项脊轩志》中，描写了项脊轩庭阶上人与自然和谐相处的景象的句子是：________，________。", answer: ["鸟时来啄食",
