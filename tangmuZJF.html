<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汤姆猫文言文跑酷</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #gameContainer {
            width: 900px;
            height: 600px;
            position: relative;
            background: #16213e;
            border: 4px solid #e94560;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.3);
        }
        
        /* 汤姆猫样式 */
        .tom-cat {
            width: 60px;
            height: 80px;
            position: absolute;
            left: 100px;
            bottom: 120px;
            z-index: 10;
            transition: bottom 0.3s ease;
        }
        
        .tom-body {
            width: 50px;
            height: 55px;
            background: #4a90d9;
            border-radius: 25px 25px 20px 20px;
            position: absolute;
            left: 5px;
            top: 20px;
            border: 2px solid #2c5a8a;
        }
        
        .tom-head {
            width: 40px;
            height: 35px;
            background: #4a90d9;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 0;
            border: 2px solid #2c5a8a;
        }
        
        .tom-ear {
            width: 12px;
            height: 16px;
            background: #4a90d9;
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -8px;
            border: 2px solid #2c5a8a;
        }
        
        .tom-ear.left { left: 8px; transform: rotate(-20deg); }
        .tom-ear.right { right: 8px; transform: rotate(20deg); }
        
        .tom-eye {
            width: 10px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            border: 1px solid #2c5a8a;
        }
        
        .tom-eye.left { left: 6px; }
        .tom-eye.right { right: 6px; }
        
        .tom-pupil {
            width: 5px;
            height: 6px;
            background: #1a1a2e;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 2px;
        }
        
        .tom-nose {
            width: 6px;
            height: 4px;
            background: #ff6b8a;
            border-radius: 50%;
            position: absolute;
            top: 18px;
            left: 17px;
        }
        
        .tom-mouth {
            width: 16px;
            height: 6px;
            border: 2px solid #2c5a8a;
            border-top: none;
            border-radius: 0 0 10px 10px;
            position: absolute;
            top: 22px;
            left: 12px;
        }
        
        .tom-whisker {
            width: 12px;
            height: 1px;
            background: #2c5a8a;
            position: absolute;
            top: 18px;
        }
        
        .tom-whisker.left1 { left: -8px; top: 16px; }
        .tom-whisker.left2 { left: -8px; top: 20px; }
        .tom-whisker.right1 { right: -8px; top: 16px; }
        .tom-whisker.right2 { right: -8px; top: 20px; }
        
        .tom-leg {
            width: 14px;
            height: 20px;
            background: #4a90d9;
            border-radius: 0 0 7px 7px;
            position: absolute;
            bottom: -18px;
            border: 2px solid #2c5a8a;
            border-top: none;
        }
        
        .tom-leg.left { left: 8px; }
        .tom-leg.right { right: 8px; }
        
        .tom-tail {
            width: 8px;
            height: 25px;
            background: #4a90d9;
            border-radius: 0 0 4px 4px;
            position: absolute;
            right: -6px;
            top: 30px;
            transform: rotate(-30deg);
            border: 2px solid #2c5a8a;
        }
        
        .tom-belly {
            width: 30px;
            height: 25px;
            background: #87ceeb;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 35px;
        }
        
        /* 跑步动画 */
        @keyframes run {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        
        .running .tom-leg.left {
            animation: run 0.3s infinite;
        }
        
        .running .tom-leg.right {
            animation: run 0.3s infinite reverse;
        }
        
        .running .tom-tail {
            animation: run 0.2s infinite;
        }
        
        /* 跳跃 */
        .jumping {
            bottom: 280px !important;
        }
        
        /* 地面 */
        .ground {
            width: 100%;
            height: 120px;
            background: #0f3460;
            position: absolute;
            bottom: 0;
            border-top: 3px solid #e94560;
        }
        
        .ground-line {
            width: 100%;
            height: 3px;
            background: #e94560;
            position: absolute;
            top: 0;
            opacity: 0.5;
        }
        
        /* 障碍物 */
        .obstacle {
            width: 40px;
            height: 50px;
            background: #e94560;
            position: absolute;
            bottom: 120px;
            border-radius: 5px 5px 0 0;
            border: 2px solid #c73e54;
        }
        
        .obstacle::before {
            content: '❌';
            position: absolute;
            top: 10px;
            left: 8px;
            font-size: 20px;
        }
        
        /* 金币 */
        .coin {
            width: 30px;
            height: 30px;
            background: #ffd700;
            border-radius: 50%;
            position: absolute;
            bottom: 200px;
            border: 3px solid #ffaa00;
            box-shadow: 0 0 10px #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #b8860b;
            font-size: 14px;
        }
        
        .coin::after {
            content: '文';
        }
        
        /* 背景装饰 */
        .bg-building {
            width: 80px;
            height: 200px;
            background: #1a1a2e;
            position: absolute;
            bottom: 120px;
            border: 2px solid #0f3460;
            opacity: 0.6;
        }
        
        .bg-building::before {
            content: '';
            width: 60px;
            height: 60px;
            background: #16213e;
            position: absolute;
            top: 20px;
            left: 8px;
            border: 1px solid #0f3460;
        }
        
        /* 答题面板 */
        #quizPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background: rgba(22, 33, 62, 0.95);
            border: 3px solid #e94560;
            border-radius: 15px;
            padding: 30px;
            z-index: 100;
            display: none;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
        }
        
        #quizPanel.active {
            display: block;
        }
        
        .quiz-title {
            color: #e94560;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .quiz-question {
            color: #eaeaea;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .quiz-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #0f3460;
            border: 2px solid #4a90d9;
            border-radius: 10px;
            color: #eaeaea;
            text-align: center;
            font-family: 'Noto Serif SC', serif;
            outline: none;
        }
        
        .quiz-input:focus {
            border-color: #e94560;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }
        
        .quiz-btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #e94560;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            transition: all 0.3s;
        }
        
        .quiz-btn:hover {
            background: #ff6b8a;
            transform: scale(1.02);
        }
        
        .quiz-hint {
            color: #87ceeb;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
        
        /* 顶部信息栏 */
        #topBar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 50;
            color: #ffd700;
            font-size: 16px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .info-label {
            color: #87ceeb;
        }
        
        /* 开始画面 */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #16213e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        .start-title {
            font-size: 42px;
            color: #e94560;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        
        .start-subtitle {
            font-size: 20px;
            color: #87ceeb;
            margin-bottom: 40px;
        }
        
        .start-btn {
            padding: 20px 60px;
            font-size: 24px;
            background: #e94560;
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        
        .start-btn:hover {
            background: #ff6b8a;
            transform: scale(1.05);
        }
        
        .start-instructions {
            margin-top: 30px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            line-height: 2;
        }
        
        /* 结果画面 */
        #resultScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        .result-title {
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        .result-title.win { color: #ffd700; }
        .result-title.lose { color: #e94560; }
        
        .result-score {
            font-size: 24px;
            color: #87ceeb;
            margin-bottom: 30px;
        }
        
        .result-detail {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            max-width: 80%;
        }
        
        /* 错误提示 */
        .error-shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        /* 正确提示 */
        .correct-glow {
            animation: glow 0.5s ease-in-out;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 0 transparent; }
            50% { box-shadow: 0 0 30px #ffd700; }
        }
        
        /* 进度条 */
        .progress-bar {
            width: 200px;
            height: 8px;
            background: #0f3460;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #e94560;
            transition: width 0.3s;
        }
        
        /* 关卡提示 */
        .level-badge {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #e94560;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 40;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .level-badge.show {
            opacity: 1;
        }
        
        /* 粒子效果 */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 60;
        }
        
        /* 生命值 */
        .lives {
            display: flex;
            gap: 5px;
        }
        
        .life {
            font-size: 20px;
            color: #e94560;
        }
        
        .life.lost {
            opacity: 0.3;
        }
        
        /* 滚动背景 */
        .scrolling-bg {
            position: absolute;
            bottom: 120px;
            left: 0;
            width: 200%;
            height: 200px;
            display: flex;
            z-index: 1;
        }
        
        .scrolling-bg-inner {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }
        
        /* 答对后的跑酷场景 */
        #runScene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 90;
        }
        
        #runScene.active {
            display: block;
        }
        
        /* 障碍物和金币容器 */
        #gameObjects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="topBar">
            <div class="info-item">
                <span class="info-label">关卡:</span>
                <span id="levelText">项脊轩志</span>
            </div>
            <div class="info-item">
                <span class="info-label">题目:</span>
                <span id="questionNum">1/10</span>
            </div>
            <div class="info-item">
                <span class="info-label">金币:</span>
                <span id="coinCount">0</span>
            </div>
            <div class="info-item lives" id="livesContainer">
                <span class="life">❤</span>
                <span class="life">❤</span>
                <span class="life">❤</span>
            </div>
        </div>
        
        <div class="level-badge" id="levelBadge">第一关：项脊轩志</div>
        
        <div class="scrolling-bg" id="scrollingBg">
            <div class="scrolling-bg-inner" id="bgInner1"></div>
            <div class="scrolling-bg-inner" id="bgInner2"></div>
        </div>
        
        <div class="ground">
            <div class="ground-line"></div>
        </div>
        
        <div class="tom-cat" id="tomCat">
            <div class="tom-ear left"></div>
            <div class="tom-ear right"></div>
            <div class="tom-head">
                <div class="tom-eye left"><div class="tom-pupil"></div></div>
                <div class="tom-eye right"><div class="tom-pupil"></div></div>
                <div class="tom-nose"></div>
                <div class="tom-mouth"></div>
                <div class="tom-whisker left1"></div>
                <div class="tom-whisker left2"></div>
                <div class="tom-whisker right1"></div>
                <div class="tom-whisker right2"></div>
            </div>
            <div class="tom-body">
                <div class="tom-belly"></div>
            </div>
            <div class="tom-leg left"></div>
            <div class="tom-leg right"></div>
            <div class="tom-tail"></div>
        </div>
        
        <div id="gameObjects"></div>
        
        <div id="quizPanel">
            <div class="quiz-title" id="quizTitle">项脊轩志 · 理解性默写</div>
            <div class="quiz-question" id="quizQuestion">题目加载中...</div>
            <input type="text" class="quiz-input" id="quizInput" placeholder="请手写输入答案（注意字词正确）" autocomplete="off">
            <button class="quiz-btn" id="submitBtn">提交答案</button>
            <div class="quiz-hint" id="quizHint">提示：注意通假字、古今异义词</div>
        </div>
        
        <div id="startScreen">
            <div class="start-title">🐱 汤姆猫文言文跑酷</div>
            <div class="start-subtitle">高中必背文言文理解性默写挑战</div>
            <button class="start-btn" id="startBtn">开始游戏</button>
            <div class="start-instructions">
                📖 第一关：《项脊轩志》10题<br>
                📖 第二关：《陈情表》10题<br>
                ✍️ 手写输入正确答案，汤姆猫才能跑酷拾取金币<br>
                ❌ 答错3次以上将重新换题，撞到障碍物失败重来<br>
                🎯 全部答对才能进入下一关！
            </div>
        </div>
        
        <div id="resultScreen">
            <div class="result-title" id="resultTitle">游戏结束</div>
            <div class="result-score" id="resultScore">得分：0</div>
            <div class="result-detail" id="resultDetail"></div>
            <button class="start-btn" id="restartBtn" style="padding: 15px 40px; font-size: 18px;">重新开始</button>
        </div>
    </div>

    <script>
        // ==================== 游戏数据 ====================
        
        // 项脊轩志题库
        const xiangJiXuanQuestions = [
            {
                question: "《项脊轩志》中，描写项脊轩的大小和面积的句子是：________，________。",
                answer: ["室仅方丈", "可容一人居"],
                keywords: ["室仅方丈", "可容一人居"],
                hint: "注意'方丈'不是寺庙主持的意思"
            },
            {
                question: "《项脊轩志》中，描写'百年老屋'项脊轩在修葺之前旧、破的句子是：________，________。",
                answer: ["尘泥渗漉", "雨泽下注"],
                keywords: ["尘泥渗漉", "雨泽下注"],
                hint: "注意'渗漉'二字的写法"
            },
            {
                question: "《项脊轩志》中，描写了北向的项脊轩修葺之前采光不好的情况的句子是：________，________。",
                answer: ["不能得日", "日过午已昏"],
                keywords: ["不能得日", "日过午已昏"],
                hint: "注意'已昏'的'已'"
            },
            {
                question: "《项脊轩志》中，描写了项脊轩庭阶上人与自然和谐相处的景象的句子是：________，________。",
                answer: ["鸟时来啄食", "人至不去"],
                keywords: ["鸟时来啄食", "人至不去"],
                hint: "注意'啄'字的写法"
            },
            {
                question: "《项脊轩志》中，描写了项脊轩里面有书香之味的句子是：________，________。",
                answer: ["借书满架", "偃仰啸歌"],
                keywords: ["借书满架", "偃仰啸歌"],
                hint: "注意'偃仰'二字的写法"
            },
            {
                question: "《项脊轩志》中，描写在明月之夜，项脊轩附近桂树的影子落在半墙上随着夜风的吹拂而不断移动景象的句子是：________，________。",
                answer: ["桂影斑驳", "风移影动"],
                keywords: ["桂影斑驳", "风移影动"],
                hint: "注意'斑驳'二字的写法"
            },
            {
                question: "《项脊轩志》中，通过描写老妪口中转述的作者母亲在门外对子女的嘘寒问暖的话语从而表达作者对母亲的怀念之情的句子是：________？________？",
                answer: ["儿寒乎", "欲食乎"],
                keywords: ["儿寒乎", "欲食乎"],
                hint: "注意两个问号"
            },
            {
                question: "《项脊轩志》中，作者的感情基调由'喜'转'悲'的过渡句是：________，________。",
                answer: ["多可喜", "亦多可悲"],
                keywords: ["多可喜", "亦多可悲"],
                hint: "注意'亦'不是'易'"
            },
            {
                question: "《项脊轩志》中，通过描写作者妻子归宁后转述其小妹的话语从而表达作者对亡妻的思念之情的句子是：________，________。",
                answer: ["闻姊家有阁子", "且何谓阁子也"],
                keywords: ["闻姊家有阁子", "且何谓阁子也"],
                hint: "注意'姊'不是'姐'"
            },
            {
                question: "《项脊轩志》结尾，作者把极深的悲痛寄寓庭中的枇杷树，'________，________'睹物思人而物是人非，不言情而情无限，言有尽而意无穷。",
                answer: ["吾妻死之年所手植也", "今已亭亭如盖矣"],
                keywords: ["吾妻死之年所手植也", "今已亭亭如盖矣"],
                hint: "注意'亭亭'不是'婷婷'"
            }
        ];
        
        // 陈情表题库
        const chenQingBiaoQuestions = [
            {
                question: "《陈情表》中，李密用'________，________'作为'陈情'的开始，同时也是全文陈述苦情的总括。",
                answer: ["臣以险衅", "夙遭闵凶"],
                keywords: ["臣以险衅", "夙遭闵凶"],
                hint: "注意'闵'是通假字，通'悯'"
            },
            {
                question: "《陈情表》中，李密一开篇写到了自己幼年的不幸遭遇，其中提到自己早年丧父的两句是：________，________。",
                answer: ["生孩六月", "慈父见背"],
                keywords: ["生孩六月", "慈父见背"],
                hint: "注意'见背'是去世的婉辞"
            },

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            switch(type) {
                case 'correct':
                    oscillator.frequency.setValueAtTime(523, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'wrong':
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'coin':
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'jump':
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'crash':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.5);
                    break;
                case 'win':
                    oscillator.frequency.setValueAtTime(523, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
                    oscillator.frequency.setValueAtTime(784, audioCtx.currentTime + 0.3);
                    oscillator.frequency.setValueAtTime(1047, audioCtx.currentTime + 0.45);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

                    oscillator.start(audioCtx.currentTime);

                    break;

        function showQuestion() {
            const q = gameState.questions[gameState.currentQuestion];
            quizTitle.textContent = gameState.currentLevel === 1 ? '项脊轩志 · 理解性默写' : '陈情表 · 理解性默写';
            quizQuestion.textContent = q.question;

            quizInput.value = '';
            quizInput.focus();
            
            quizPanel.classList.add('active');
            tomCat.classList.remove('running');
            
            gameObjectsContainer.innerHTML = '';
            gameState.gameObjects = [];
            gameState.isRunning = false;
        }
        
        function checkAnswer() {
            const userAnswer = quizInput.value.trim();
            if (!userAnswer) {
                quizInput.classList.add('error-shake');
                setTimeout(() => quizInput.classList.remove('error-shake'), 500);
                return;
            }
            
            const q = gameState.questions[gameState.currentQuestion];
            const separators = /[,，;；\.。\s]+/;
            
            let correct = false;
            
            if (q.keywords) {
                correct = q.keywords.every(keyword => userAnswer.includes(keyword));
            }
            
            if (!correct && q.answer) {
                correct = q.answer.every(part => userAnswer.includes(part));
            }
            
            if (correct) {
                playSound('correct');
                quizPanel.classList.remove('active');
                quizInput.classList.add('correct-glow');
                setTimeout(() => quizInput.classList.remove('correct-glow'), 500);
                startRunning();
            } else {
                playSound('wrong');
                gameState.wrongCount++;
                gameState.totalWrong++;
                
                quizInput.classList.add('error-shake');
                setTimeout(() => quizInput.classList.remove('error-shake'), 500);
                
                const correctAnswer = q.answer.join('，');
                quizHint.innerHTML = `❌ 答案错误！正确答案是：<span style="color:#ffd700">${correctAnswer}</span><br>你已答错 ${gameState.wrongCount} 次`;
                
                if (gameState.wrongCount >= 3) {
                    setTimeout(() => {
                        if (!gameState.usedBackup) {
                            const backup = gameState.currentLevel === 1 ? backupXiangJiXuan : backupChenQingBiao;
                            const randomBackup = backup[Math.floor(Math.random() * backup.length)];
                            gameState.questions[gameState.currentQuestion] = randomBackup;
                            gameState.usedBackup = true;
                            quizHint.innerHTML = '🔄 已更换新题目，请重新作答！';
                        } else {
                            const allQuestions = gameState.currentLevel === 1 ? xiangJiXuanQuestions : chenQingBiaoQuestions;
                            const remaining = allQuestions.filter(q => !gameState.questions.includes(q));
                            if (remaining.length > 0) {
                                gameState.questions[gameState.currentQuestion] = remaining[Math.floor(Math.random() * remaining.length)];
                            }
                            quizHint.innerHTML = '🔄 已更换新题目，请重新作答！';
                        }
                        gameState.wrongCount = 0;
                        setTimeout(showQuestion, 1500);
                    }, 2000);
                } else {
                    quizInput.value = '';
                    quizInput.focus();
                }
            }
        }

        function spawnGameObjects() {
            gameObjectsContainer.innerHTML = '';
            gameState.gameObjects = [];
            
            for (let i = 0; i < 5; i++) {
                const coin = document.createElement('div');

                });

                const obstacle = document.createElement('div');

        function startBgScroll() {
            let position = 0;
            bgScrollTimer = setInterval(() => {
                position -= 2;
                scrollingBg.style.transform = `translateX(${position}px)`;
                
                gameState.gameObjects.forEach(obj => {
                    obj.x -= 3;
                    obj.el.style.left = obj.x + 'px';
                    
                    if (!obj.collected && !obj.hit) {
                        checkCollision(obj);
                    }
                    
                    if (obj.x < -50) {
                        obj.el.style.display = 'none';
                    }
                });
            }, 16);
        }
        
        function checkCollision(obj) {
            const tomRect = tomCat.getBoundingClientRect();
            const gameContainerRect = document.getElementById('gameContainer').getBoundingClientRect();
            
            const tomLeft = tomRect.left - gameContainerRect.left;
            const tomRight = tomLeft + tomRect.width;
            const tomTop = tomRect.top - gameContainerRect.top;
            const tomBottom = tomTop + tomRect.height;
            
            const objRect = obj.el.getBoundingClientRect();
            const objLeft = objRect.left - gameContainerRect.left;
            const objRight = objLeft + objRect.width;
            const objTop = objRect.top - gameContainerRect.top;
            const objBottom = objTop + objRect.height;
            
            if (tomLeft < objRight && tomRight > objLeft && 
                tomTop < objBottom && tomBottom > objTop) {
                
                if (obj.type === 'coin' && !obj.collected) {
                    obj.collected = true;
                    obj.el.style.display = 'none';
                    gameState.coins += 10;
                    coinCount.textContent = gameState.coins;
                    playSound('coin');
                    createParticles(objLeft + 15, objTop + 15, '#ffd700');
                } else if (obj.type === 'obstacle' && !obj.hit) {
                    obj.hit = true;
                    playSound('crash');
                    createParticles(objLeft + 20, objTop + 25, '#e94560');
                    endRunning(false);
                }
            }
        }
        
        function handleJump(e) {
            if (e.code === 'Space' && !gameState.isJumping && gameState.isRunning) {
                e.preventDefault();
                gameState.isJumping = true;
                tomCat.classList.add('jumping');
                playSound('jump');
                
                setTimeout(() => {
                    tomCat.classList.remove('jumping');
                    gameState.isJumping = false;
                }, 600);
            }
        }
        
        function endRunning(success) {
            gameState.isRunning = false;
            tomCat.classList.remove('running');
            document.removeEventListener('keydown', handleJump);
            
            clearInterval(bgScrollTimer);
            
            if (success) {
                gameState.currentQuestion++;
                
                if (gameState.currentQuestion >= 10) {
                    if (gameState.currentLevel === 1) {
                        setTimeout(() => {
                            gameState.currentLevel = 2;
                            gameState.currentQuestion = 0;
                            gameState.questions = [...chenQingBiaoQuestions];
                            updateUI();
                            showLevelBadge();
                            showQuestion();
                        }, 1000);
                    } else {
                        showWinScreen();
                    }
                } else {
                    updateUI();
                    setTimeout(showQuestion, 1000);
                }
            } else {
                gameState.lives--;
                updateUI();
                
                if (gameState.lives <= 0) {
                    showLoseScreen();
                } else {
                    setTimeout(() => {
                        quizHint.innerHTML = '💔 撞到障碍物！失去一条生命，请重新回答本题。';
                        showQuestion();
                    }, 1000);
                }
            }
        }
        
        // ==================== 粒子效果 ====================
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = color;
                document.getElementById('gameContainer').appendChild(particle);
                
                const angle = (Math.PI * 2 * i) / 8;
                const velocity = 3 + Math.random() * 3;
                let px = x;
                let py = y;
                let opacity = 1;
                
                const animate = () => {
                    px += Math.cos(angle) * velocity;
                    py += Math.sin(angle) * velocity + 2;
                    opacity -= 0.03;
                    
                    particle.style.left = px + 'px';
                    particle.style.top = py + 'px';
                    particle.style.opacity = opacity;
                    
                    if (opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        particle.remove();
                    }
                };
                
                requestAnimationFrame(animate);
            }
        }

                `❌ 总答错次数：${gameState.totalWrong} 次`;
        }
        
        // ==================== 事件监听 ====================
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        submitBtn.addEventListener('click', checkAnswer);
        
        quizInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
        
        // 初始化
        initBackground();
    </script>
</body>
</html>
