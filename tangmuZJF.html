<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汤姆猫文言文跑酷</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #gameContainer {
            width: 900px;
            height: 600px;
            position: relative;
            background: #16213e;
            border: 4px solid #e94560;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.3);
        }
        
        /* 汤姆猫样式 */
        .tom-cat {
            width: 60px;
            height: 80px;
            position: absolute;
            left: 100px;
            bottom: 120px;
            z-index: 10;
            transition: bottom 0.3s ease;
        }
        
        .tom-body {
            width: 50px;
            height: 55px;
            background: #4a90d9;
            border-radius: 25px 25px 20px 20px;
            position: absolute;
            left: 5px;
            top: 20px;
            border: 2px solid #2c5a8a;
        }
        
        .tom-head {
            width: 40px;
            height: 35px;
            background: #4a90d9;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 0;
            border: 2px solid #2c5a8a;
        }
        
        .tom-ear {
            width: 12px;
            height: 16px;
            background: #4a90d9;
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -8px;
            border: 2px solid #2c5a8a;
        }
        
        .tom-ear.left { left: 8px; transform: rotate(-20deg); }
        .tom-ear.right { right: 8px; transform: rotate(20deg); }
        
        .tom-eye {
            width: 10px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            border: 1px solid #2c5a8a;
        }
        
        .tom-eye.left { left: 6px; }
        .tom-eye.right { right: 6px; }
        
        .tom-pupil {
            width: 5px;
            height: 6px;
            background: #1a1a2e;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 2px;
        }
        
        .tom-nose {
            width: 6px;
            height: 4px;
            background: #ff6b8a;
            border-radius: 50%;
            position: absolute;
            top: 18px;
            left: 17px;
        }
        
        .tom-mouth {
            width: 16px;
            height: 6px;
            border: 2px solid #2c5a8a;
            border-top: none;
            border-radius: 0 0 10px 10px;
            position: absolute;
            top: 22px;
            left: 12px;
        }
        
        .tom-whisker {
            width: 12px;
            height: 1px;
            background: #2c5a8a;
            position: absolute;
            top: 18px;
        }
        
        .tom-whisker.left1 { left: -8px; top: 16px; }
        .tom-whisker.left2 { left: -8px; top: 20px; }
        .tom-whisker.right1 { right: -8px; top: 16px; }
        .tom-whisker.right2 { right: -8px; top: 20px; }
        
        .tom-leg {
            width: 14px;
            height: 20px;
            background: #4a90d9;
            border-radius: 0 0 7px 7px;
            position: absolute;
            bottom: -18px;
            border: 2px solid #2c5a8a;
            border-top: none;
        }
        
        .tom-leg.left { left: 8px; }
        .tom-leg.right { right: 8px; }
        
        .tom-tail {
            width: 8px;
            height: 25px;
            background: #4a90d9;
            border-radius: 0 0 4px 4px;
            position: absolute;
            right: -6px;
            top: 30px;
            transform: rotate(-30deg);
            border: 2px solid #2c5a8a;
        }
        
        .tom-belly {
            width: 30px;
            height: 25px;
            background: #87ceeb;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 35px;
        }
        
        /* 跑步动画 */
        @keyframes run {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        
        .running .tom-leg.left {
            animation: run 0.3s infinite;
        }
        
        .running .tom-leg.right {
            animation: run 0.3s infinite reverse;
        }
        
        .running .tom-tail {
            animation: run 0.2s infinite;
        }
        
        /* 跳跃 */
        .jumping {
            bottom: 280px !important;
        }
        
        /* 地面 */
        .ground {
            width: 100%;
            height: 120px;
            background: #0f3460;
            position: absolute;
            bottom: 0;
            border-top: 3px solid #e94560;
        }
        
        .ground-line {
            width: 100%;
            height: 3px;
            background: #e94560;
            position: absolute;
            top: 0;
            opacity: 0.5;
        }
        
        /* 障碍物 */
        .obstacle {
            width: 40px;
            height: 50px;
            background: #e94560;
            position: absolute;
            bottom: 120px;
            border-radius: 5px 5px 0 0;
            border: 2px solid #c73e54;
        }
        
        .obstacle::before {
            content: '❌';
            position: absolute;
            top: 10px;
            left: 8px;
            font-size: 20px;
        }
        
        /* 金币 */
        .coin {
            width: 30px;
            height: 30px;
            background: #ffd700;
            border-radius: 50%;
            position: absolute;
            bottom: 200px;
            border: 3px solid #ffaa00;
            box-shadow: 0 0 10px #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #b8860b;
            font-size: 14px;
        }
        
        .coin::after {
            content: '文';
        }
        
        /* 背景装饰 */
        .bg-building {
            width: 80px;
            height: 200px;
            background: #1a1a2e;
            position: absolute;
            bottom: 120px;
            border: 2px solid #0f3460;
            opacity: 0.6;
        }
        
        .bg-building::before {
            content: '';
            width: 60px;
            height: 60px;
            background: #16213e;
            position: absolute;
            top: 20px;
            left: 8px;
            border: 1px solid #0f3460;
        }
        
        /* 答题面板 */
        #quizPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background: rgba(22, 33, 62, 0.95);
            border: 3px solid #e94560;
            border-radius: 15px;
            padding: 30px;
            z-index: 100;
            display: none;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
        }
        
        #quizPanel.active {
            display: block;
        }
        
        .quiz-title {
            color: #e94560;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .quiz-question {
            color: #eaeaea;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .quiz-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #0f3460;
            border: 2px solid #4a90d9;
            border-radius: 10px;
            color: #eaeaea;
            text-align: center;
            font-family: 'Noto Serif SC', serif;
            outline: none;
        }
        
        .quiz-input:focus {
            border-color: #e94560;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }
        
        .quiz-btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #e94560;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            transition: all 0.3s;
        }
        
        .quiz-btn:hover {
            background: #ff6b8a;
            transform: scale(1.02);
        }
        
        .quiz-hint {
            color: #87ceeb;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
        
        /* 顶部信息栏 */
        #topBar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 50;
            color: #ffd700;
            font-size: 16px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .info-label {
            color: #87ceeb;
        }
        
        /* 开始画面 */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #16213e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        .start-title {
            font-size: 42px;
            color: #e94560;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        
        .start-subtitle {
            font-size: 20px;
            color: #87ceeb;
            margin-bottom: 40px;
        }
        
        .start-btn {
            padding: 20px 60px;
            font-size: 24px;
