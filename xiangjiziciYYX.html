<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汤姆猫文言文跑酷</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #gameContainer {
            width: 900px;
            height: 600px;
            position: relative;
            background: #16213e;
            border: 4px solid #e94560;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.3);
        }
        
        /* 汤姆猫样式 */
        .tom-cat {
            width: 60px;
            height: 80px;
            position: absolute;
            left: 100px;
            bottom: 120px;
            z-index: 10;
        }
        
        .tom-body {
            width: 50px;
            height: 55px;
            background: #4a90d9;
            border-radius: 25px 25px 20px 20px;
            position: absolute;
            left: 5px;
            top: 20px;
            border: 2px solid #2c5a8a;
        }
        
        .tom-head {
            width: 40px;
            height: 35px;
            background: #4a90d9;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 0;
            border: 2px solid #2c5a8a;
        }
        
        .tom-ear {
            width: 12px;
            height: 16px;
            background: #4a90d9;
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -8px;
            border: 2px solid #2c5a8a;
        }
        
        .tom-ear.left { left: 8px; transform: rotate(-20deg); }
        .tom-ear.right { right: 8px; transform: rotate(20deg); }
        
        .tom-eye {
            width: 10px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            border: 1px solid #2c5a8a;
        }
        
        .tom-eye.left { left: 6px; }
        .tom-eye.right { right: 6px; }
        
        .tom-pupil {
            width: 5px;
            height: 6px;
            background: #1a1a2e;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 2px;
        }
        
        .tom-nose {
            width: 6px;
            height: 4px;
            background: #ff6b8a;
            border-radius: 50%;
            position: absolute;
            top: 18px;
            left: 17px;
        }
        
        .tom-mouth {
            width: 16px;
            height: 6px;
            border: 2px solid #2c5a8a;
            border-top: none;
            border-radius: 0 0 10px 10px;
            position: absolute;
            top: 22px;
            left: 12px;
        }
        
        .tom-whisker {
            width: 12px;
            height: 1px;
            background: #2c5a8a;
            position: absolute;
            top: 18px;
        }
        
        .tom-whisker.left1 { left: -8px; top: 16px; }
        .tom-whisker.left2 { left: -8px; top: 20px; }
        .tom-whisker.right1 { right: -8px; top: 16px; }
        .tom-whisker.right2 { right: -8px; top: 20px; }
        
        .tom-leg {
            width: 14px;
            height: 20px;
            background: #4a90d9;
            border-radius: 0 0 7px 7px;
            position: absolute;
            bottom: -18px;
            border: 2px solid #2c5a8a;
            border-top: none;
        }
        
        .tom-leg.left { left: 8px; }
        .tom-leg.right { right: 8px; }
        
        .tom-tail {
            width: 8px;
            height: 25px;
            background: #4a90d9;
            border-radius: 0 0 4px 4px;
            position: absolute;
            right: -6px;
            top: 30px;
            transform: rotate(-30deg);
            border: 2px solid #2c5a8a;
        }
        
        .tom-belly {
            width: 30px;
            height: 25px;
            background: #87ceeb;
            border-radius: 50%;
            position: absolute;
            left: 10px;
            top: 35px;
        }
        
        /* 跑步动画 */
        @keyframes run {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
        }
        
        .running .tom-leg.left { animation: run 0.2s infinite; }
        .running .tom-leg.right { animation: run 0.2s infinite reverse; }
        .running .tom-tail { animation: run 0.15s infinite; }
        
        /* 地面 */
        .ground {
            width: 100%;
            height: 120px;
            background: #0f3460;
            position: absolute;
            bottom: 0;
            border-top: 3px solid #e94560;
        }
        
        /* 障碍物 */
        .obstacle {
            width: 40px;
            height: 50px;
            background: #e94560;
            position: absolute;
            bottom: 120px;
            border-radius: 5px 5px 0 0;
            border: 2px solid #c73e54;
        }
        
        .obstacle::before {
            content: '❌';
            position: absolute;
            top: 10px;
            left: 8px;
            font-size: 20px;
        }
        
        /* 金币 */
        .coin {
            width: 34px;
            height: 34px;
            background: #ffd700;
            border-radius: 50%;
            position: absolute;
            bottom: 240px;
            border: 3px solid #ffaa00;
            box-shadow: 0 0 10px #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #b8860b;
            font-size: 14px;
        }
        
        .coin::after {
            content: '文';
        }
        
        /* 答题面板 */
        #quizPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            background: rgba(22, 33, 62, 0.95);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            z-index: 100;
            display: none;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }
        
        #quizPanel.active { display: block; }
        .quiz-title { color: #ffd700; font-size: 24px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .quiz-question { color: #eaeaea; font-size: 18px; line-height: 1.8; margin-bottom: 20px; text-align: center; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-btn {
            width: 100%;
            padding: 12px;
            background: #0f3460;
            border: 2px solid #4a90d9;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            transition: all 0.2s;
            text-align: left;
            padding-left: 20px;
        }
        .quiz-btn:hover { background: #4a90d9; border-color: #ffd700; }
        
        /* 顶部信息栏 */
        #topBar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 50;
            color: #ffd700;
            font-size: 16px;
        }
        .info-item { display: flex; align-items: center; gap: 5px; }
        .info-label { color: #87ceeb; }
        
        /* 开始与结束画面 */
        #startScreen, #resultScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #16213e;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 200;
        }
        #resultScreen { background: rgba(0,0,0,0.9); display: none; }
        .start-title { font-size: 42px; color: #e94560; margin-bottom: 20px; text-shadow: 0 0 20px rgba(233, 69, 96, 0.5); }
        .start-subtitle { font-size: 20px; color: #87ceeb; margin-bottom: 40px; }
        .action-btn {
            padding: 15px 50px; font-size: 22px; background: #e94560; border: none; border-radius: 15px;
            color: white; cursor: pointer; font-family: 'Noto Serif SC', serif; transition: all 0.3s;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        .action-btn:hover { background: #ff6b8a; transform: scale(1.05); }
        .instructions { margin-top: 30px; color: #aaa; font-size: 14px; text-align: center; line-height: 2; }
        
        .result-title { font-size: 36px; margin-bottom: 20px; }
        .result-title.win { color: #ffd700; }
        .result-score { font-size: 24px; color: #87ceeb; margin-bottom: 30px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- 顶部状态栏 -->
    <div id="topBar">
        <div class="info-item"><span class="info-label">得分:</span><span id="scoreVal">0</span></div>
        <div class="info-item"><span class="info-label">进度:</span><span id="progressVal">0%</span></div>
    </div>

    <!-- 汤姆猫 -->
    <div id="tom" class="tom-cat running">
        <div class="tom-ear left"></div>
        <div class="tom-ear right"></div>
        <div class="tom-head">
            <div class="tom-eye left"><div class="tom-pupil"></div></div>
            <div class="tom-eye right"><div class="tom-pupil"></div></div>
            <div class="tom-nose"></div>
            <div class="tom-mouth"></div>
            <div class="tom-whisker left1"></div>
            <div class="tom-whisker left2"></div>
            <div class="tom-whisker right1"></div>
            <div class="tom-whisker right2"></div>
        </div>
        <div class="tom-body">
            <div class="tom-belly"></div>
        </div>
        <div class="tom-tail"></div>
        <div class="tom-leg left"></div>
        <div class="tom-leg right"></div>
    </div>

    <!-- 地面 -->
    <div class="ground"></div>

    <!-- 答题面板 -->
    <div id="quizPanel">
        <div class="quiz-title">💡 文言断句与翻译</div>
        <div id="questionText" class="quiz-question">加载中...</div>
        <div class="quiz-options" id="optionsContainer"></div>
    </div>

    <!-- 开始画面 -->
    <div id="startScreen">
        <div class="start-title">汤姆猫文言文跑酷</div>
        <div class="start-subtitle">御猫凌空踏步，妙解圣贤之言</div>
        <button class="action-btn" onclick="startGame()">开始游戏</button>
        <div class="instructions">
            操作指南：按下 <b>空格键 (Space)</b> 或 <b>点击游戏画面</b> 触发跳跃<br>
            碰触【金币】触发文言文答题，答对获得高额积分！避免碰撞【❌障碍物】！
        </div>
    </div>

    <!-- 结算画面 -->
    <div id="resultScreen">
        <div class="result-title win">试炼结束</div>
        <div class="result-score">最终得分: <span id="finalScore">0</span></div>
        <button class="action-btn" onclick="restartGame()">再来一次</button>
    </div>
</div>

<script>
    // 基础配置与游戏状态
    const container = document.getElementById('gameContainer');
    const tom = document.getElementById('tom');
    const quizPanel = document.getElementById('quizPanel');
    const scoreVal = document.getElementById('scoreVal');
    const progressVal = document.getElementById('progressVal');
    
    let score = 0;
    let isJumping = false;
    let gameActive = false;
    let gameElements = [];
    let gameDistance = 0;
    const maxDistance = 2000; // 达到此距离通关
    
    // 文言文题库（可以根据教学进度自行增删）
    const quizBank = [
        { q: "“学而时习之，不亦说乎”中的“说”通假哪个字？", a: ["悦（愉快）", "说（说话）", "税（税收）", "脱（脱离）"], right: 0 },
        { q: "“温故而知新”中，“故”的意思是什么？", a: ["故意", "缘故", "旧的知识", "死去的人"], right: 2 },
        { q: "“三人行，必有我师焉”中的“焉”是什么词性词义？", a: ["代词：他们", "语气词：啊", "兼词：在其中", "连词：然后"], right: 2 },
        { q: "“逝者如斯夫，不舍昼夜”中，孔子是用什么来比喻消逝的时间？", a: ["奔流的河水", "天上的云彩", "吹过的风", "凋谢的花朵"], right: 0 }
    ];

    // 汤姆猫跳跃逻辑
    function jump() {
        if (isJumping || !gameActive || quizPanel.classList.contains('active')) return;
        isJumping = true;
        tom.classList.remove('running');
        
        let position = 120; // 起始高度
        let upInterval = setInterval(() => {
            if (position >= 280) { // 最高点
                clearInterval(upInterval);
                let downInterval = setInterval(() => {
                    if (position <= 120) { // 回到地面
                        clearInterval(downInterval);
                        isJumping = false;
                        if (gameActive && !quizPanel.classList.contains('active')) {
                            tom.classList.add('running');
                        }
                    }
                    position -= 6;
                    tom.style.bottom = position + 'px';
                }, 15);
            }
            position += 8;
            tom.style.bottom = position + 'px';
        }, 15);
    }

    // 键盘与点击监听
    document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
    container.addEventListener('click', jump);

    // 游戏核心循环
    function gameLoop() {
        if (!gameActive) return;
        
        // 游戏处于答题暂停状态
        if (quizPanel.classList.contains('active')) {
            requestAnimationFrame(gameLoop);
            return;
        }

        gameDistance += 2;
        let progress = Math.min(Math.round((gameDistance / maxDistance) * 100), 100);
        progressVal.innerText = progress + "%";
        
        if (gameDistance >= maxDistance) {
            endGame();
            return;
        }

        // 随机生成障碍物或金币
        if (Math.random() < 0.015 && gameElements.length < 3) {
            const lastElem = gameElements[gameElements.length - 1];
            if (!lastElem || parseInt(lastElem.style.right) > 250) {
                createRandomElement();
            }
        }

        // 移动元素并进行碰撞检测
        for (let i = gameElements.length - 1; i >= 0; i--) {
            let elem = gameElements[i];
            let right = parseInt(elem.style.right) || 0;
            right += 5; // 移动速度
            elem.style.right = right + 'px';

            // 越界移除
            if (right > 900) {
                elem.remove();
                gameElements.splice(i, 1);
                continue;
            }

            // 碰撞检测计算
            let tomRect = tom.getBoundingClientRect();
            let elemRect = elem.getBoundingClientRect();

            if (
                tomRect.left < elemRect.right &&
                tomRect.right > elemRect.left &&
                tomRect.top < elemRect.bottom &&
                tomRect.bottom > elemRect.top
            ) {
                if (elem.classList.contains('obstacle')) {
                    // 撞到障碍物扣分并移除障碍物
                    score = Math.max(0, score - 10);
                    scoreVal.innerText = score;
                    elem.remove();
                    gameElements.splice(i, 1);
                    // 闪红特效
                    container.style.borderColor = '#ff0000';
                    setTimeout(() => container.style.borderColor = '#e94560', 200);
                } else if (elem.classList.contains('coin')) {
                    // 吃到金币，触发答题
                    elem.remove();
                    gameElements.splice(i, 1);
                    triggerQuiz();
                }
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // 创建随机障碍或金币
    function createRandomElement() {
        const isCoin = Math.random() > 0.4;
        const elem = document.createElement('div');
        elem.className = isCoin ? 'coin' : 'obstacle';
        elem.style.right = '-50px';
        container.appendChild(elem);
        gameElements.push(elem);
    }

    // 触发文言文答题
    function triggerQuiz() {
        tom.classList.remove('running');
        quizPanel.classList.add('active');
        
        // 随机抽题
        const currentQuiz = quizBank[Math.floor(Math.random() * quizBank.length)];
        document.getElementById('questionText').innerText = currentQuiz.q;
        
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        
        currentQuiz.a.forEach((optionText, index) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerText = `${String.fromCharCode(65 + index)}. ${optionText}`;
            btn.onclick = () => {
                if (index === currentQuiz.right) {
                    score += 50; // 答对奖励高分
                    container.style.borderColor = '#00ff00';
                } else {
                    score = Math.max(0, score - 20); // 答错惩罚
                    container.style.borderColor = '#ff0000';
                }
                scoreVal.innerText = score;
                setTimeout(() => container.style.borderColor = '#e94560', 300);
                
                // 关闭面板，恢复游戏
                quizPanel.classList.remove('active');
                if (!isJumping) tom.classList.add('running');
            };
            optionsContainer.appendChild(btn);
        });
    }

    // 游戏生命周期控制
    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'none';
        score = 0;
        gameDistance = 0;
        scoreVal.innerText = '0';
        progressVal.innerText = '0%';
        gameActive = true;
        tom.classList.add('running');
        gameLoop();
    }

    function endGame() {
        gameActive = false;
        tom.classList.remove('running');
        // 清理屏幕上的剩余物体
        gameElements.forEach(e => e.remove());
        gameElements = [];
        
        document.getElementById('finalScore').innerText = score;
        document.getElementById('resultScreen').style.display = 'flex';
    }

    function restartGame() {
        startGame();
    }
</script>
</body>
</html>
