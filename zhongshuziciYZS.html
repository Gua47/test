<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>种树郭橐驼传 - 语文闯关</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a3a1a 0%, #2d5a27 50%, #1a3a1a 100%);
            min-height: 100vh;
            color: #f5f0e0;
            overflow-x: hidden;
            /* 阻止微信下的橡皮筋下拉效果 */
            overscroll-behavior-y: none;
        }
        .game-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            position: relative;
        }
        /* 首页 */
        .home-screen { text-align: center; padding-top: 30px; }
        .title { font-size: 2.2em; color: #d4a574; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 10px; }
        .subtitle { font-size: 1em; color: #b8d4a8; margin-bottom: 5px; }
        .author { font-size: 0.9em; color: #8fbc8f; margin-bottom: 30px; }
        .tree-icon { font-size: 4em; margin: 20px 0; animation: sway 3s ease-in-out infinite; }
        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .btn {
            display: block; width: 80%; max-width: 300px; margin: 12px auto; padding: 14px 20px;
            border: none; border-radius: 30px; font-size: 1.1em; cursor: pointer;
            transition: all 0.3s; font-family: inherit; -webkit-tap-highlight-color: transparent;
        }
        .btn-primary { background: linear-gradient(135deg, #d4a574, #c4956a); color: #1a3a1a; font-weight: bold; }
        .btn-primary:active { transform: scale(0.95); }
        .btn-secondary { background: rgba(255,255,255,0.15); color: #f5f0e0; border: 1px solid rgba(255,255,255,0.3); }
        .btn-secondary:active { background: rgba(255,255,255,0.25); }
        .locked { opacity: 0.5; pointer-events: none; }
        /* 关卡选择 */
        .level-select { display: none; padding-top: 20px; }
        .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .level-card {
            background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px 10px;
            text-align: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent;
        }
        .level-card:active:not(.locked) { transform: translateY(2px); }
        .level-card.locked { background: rgba(0,0,0,0.2); }
        .level-num { font-size: 2em; color: #d4a574; font-weight: bold; }
        .level-name { font-size: 0.9em; margin-top: 5px; color: #b8d4a8; }
        .level-stars { margin-top: 8px; font-size: 1.2em; }
        /* 游戏界面 */
        .game-screen { display: none; padding-top: 10px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 15px; }
        .progress-info { font-size: 0.85em; }
        .score-display { font-size: 1.2em; color: #ffd700; }
        .timer { font-size: 1.1em; color: #ff8c8c; }
        .question-box { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 15px; min-height: 120px; }
        .question-type { display: inline-block; background: #d4a574; color: #1a3a1a; padding: 3px 12px; border-radius: 12px; font-size: 0.75em; margin-bottom: 10px; }
        .question-text { font-size: 1.15em; line-height: 1.6; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option {
            background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 12px;
            padding: 14px 16px; cursor: pointer; transition: all 0.2s; font-size: 1em; line-height: 1.5; -webkit-tap-highlight-color: transparent;
        }
        .option:active { background: rgba(255,255,255,0.15); }
        .option.correct { background: rgba(76,175,80,0.3); border-color: #4caf50; }
        .option.wrong { background: rgba(244,67,54,0.3); border-color: #f44336; }
        .option.disabled { pointer-events: none; }
        /* 结果弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: linear-gradient(135deg, #2d5a27, #1a3a1a); border-radius: 20px; padding: 30px 20px; text-align: center; max-width: 350px; width: 100%; border: 2px solid #d4a574; }
        .modal-title { font-size: 1.5em; color: #d4a574; margin-bottom: 15px; }
        .modal-score { font-size: 3em; color: #ffd700; margin: 10px 0; }
        .modal-stars { font-size: 2em; margin: 10px 0; }
        .modal-msg { font-size: 1em; color: #b8d4a8; margin: 15px 0; }
        /* 解析面板 */
        .explanation { background: rgba(212,165,116,0.15); border-left: 3px solid #d4a574; padding: 12px 15px; margin-top: 10px; border-radius: 0 10px 10px 0; font-size: 0.9em; line-height: 1.6; display: none; }
        .explanation.show { display: block; }
        .next-btn { margin-top: 15px; background: #d4a574; color: #1a3a1a; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1em; cursor: pointer; display: none; }
        .next-btn.show { display: inline-block; }
        /* 排行榜/统计 */
        .stats-bar { display: flex; justify-content: space-around; margin: 15px 0; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5em; color: #d4a574; font-weight: bold; }
        .stat-label { font-size: 0.75em; color: #8fbc8f; }
        /* 生命值 */
        .lives { font-size: 1.3em; }
        /* 连击 */
        .combo { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2em; color: #ffd700; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); display: none; z-index: 50; animation: comboPop 0.8s ease-out; }
        @keyframes comboPop { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
        /* 返回按钮 */
        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.15); border: none; color: #f5f0e0; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9em; }
        .hint-btn { background: rgba(255,215,0,0.2); border: 1px solid #ffd700; color: #ffd700; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 0.8em; margin-top: 10px; }
        .hint-text { display: none; color: #ffd700; font-size: 0.85em; margin-top: 8px; font-style: italic; }
        /* 滚动条 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4a574; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="home-screen" id="homeScreen">
            <div class="tree-icon">🌳</div>
            <h1 class="title">种树郭橐驼传</h1>
            <p class="subtitle">高中语文 · 课下注释闯关</p>
            <p class="author">唐 · 柳宗元</p>
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalStars">0</div>
                    <div class="stat-label">总星数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="completedLevels">0</div>
                    <div class="stat-label">通关数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalScore">0</div>
                    <div class="stat-label">总积分</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="showLevelSelect()">开始闯关</button>
            <button class="btn btn-secondary" onclick="showRules()">游戏规则</button>
        </div>

        <div class="level-select" id="levelSelect">
            <button class="back-btn" onclick="showHome()">← 返回</button>
            <h2 style="text-align:center; color:#d4a574; margin-top:40px; margin-bottom:10px;">选择关卡</h2>
            <p style="text-align:center; color:#8fbc8f; font-size:0.85em;">逐层深入，掌握郭橐驼的种树智慧</p>
            <div class="level-grid" id="levelGrid"></div>
        </div>

        <div class="game-screen" id="gameScreen">
            <button class="back-btn" onclick="confirmQuit()">← 退出</button>
            <div class="top-bar">
                <div class="progress-info">
                    <span id="levelName">关卡1</span> · 第<span id="currentQ">1</span>/<span id="totalQ">10</span>题
                </div>
                <div class="lives" id="livesDisplay">❤️❤️❤️</div>
            </div>
            <div class="score-display" style="text-align:center; margin-bottom:10px;">
                得分: <span id="currentScore">0</span>
            </div>
            <div class="question-box">
                <span class="question-type" id="qType">字词解释</span>
                <div class="question-text" id="questionText"></div>
                <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 提示 (-20分)</button>
                <div class="hint-text" id="hintText"></div>
            </div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="explanation" id="explanation"></div>
            <div style="text-align:center;">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
            </div>
        </div>

        <div class="modal-overlay" id="resultModal">
            <div class="modal">
                <div class="modal-title" id="modalTitle">关卡完成!</div>
                <div class="modal-score" id="modalScore">85</div>
                <div class="modal-stars" id="modalStars">⭐⭐⭐</div>
                <div class="modal-msg" id="modalMsg">不错!继续加油!</div>
                <button class="btn btn-primary" onclick="backToLevels()" style="margin-top:15px;">返回关卡</button>
                <button class="btn btn-secondary" onclick="retryLevel()" style="margin-top:10px;">重新挑战</button>
            </div>
        </div>

        <div class="modal-overlay" id="rulesModal">
            <div class="modal" style="text-align:left;">
                <div class="modal-title" style="text-align:center;">游戏规则</div>
                <div style="line-height:2; font-size:0.95em;">
                    <p>🌳 <b>种树郭橐驼传</b> 语文闯关游戏</p>
                    <p>📚 共4个关卡，每关10题，难度递增</p>
                    <p>❤️ 每关3条生命，答错扣1心</p>
                    <p>⭐ 根据得分评星：90+三星，70+两星，50+一星</p>
                    <p>💡 可使用提示，但会扣20分</p>
                    <p>🔥 连续答对可获得连击加分</p>
                    <p>🎯 通关后解锁下一关卡</p>
                </div>
                <button class="btn btn-primary" onclick="closeRules()" style="margin-top:15px;">知道了</button>
            </div>
        </div>

        <div class="combo" id="comboDisplay"></div>
    </div>

<script>
// ===================== 游戏数据 =====================
// 已修复所有字符串双引号嵌套导致的语法错误
const levels = [
    {
        name: "初识橐驼",
        desc: "基础字词",
        questions: [
            {
                type: "字词解释",
                question: "“郭橐驼”中“橐驼”是什么意思？",
                options: ["骆驼", "驼背的人", "一种树", "地名"],
                answer: 1,
                explanation: "橐驼：骆驼。这里指郭橐驼是个驼背的人，因形似骆驼而得名。",
                hint: "想想郭橐驼为什么叫这个名字"
            },
            {
                type: "字词解释",
                question: "“病偻”中“偻”的意思是？",
                options: ["懒惰", "脊背弯曲（驼背）", "疾病", "瘦弱"],
                answer: 1,
                explanation: "偻：脊背弯曲，即驼背。病偻：患了驼背病。",
                hint: "与“佝偻病”的“偻”同义"
            },
            {
                type: "字词解释",
                question: "“隆然伏行”中“隆然”的意思是？",
                options: ["突然", "高耸的样子", "弯腰的样子", "缓慢"],
                answer: 1,
                explanation: "隆然：高耸的样子，这里形容脊背高起。伏行：弯着腰走路。",
                hint: "形容驼背的样子"
            },
            {
                type: "字词解释",
                question: "“有类橐驼者”中“类”的意思是？",
                options: ["种类", "类似，像", "分类", "类别"],
                answer: 1,
                explanation: "类：类似，像。整句意为“有点像骆驼的样子”。",
                hint: "“类似”的“类”"
            },
            {
                type: "字词解释",
                question: "“故乡人号之‘驼’”中“号”的意思是？",
                options: ["号召", "称呼，叫", "记号", "号码"],
                answer: 1,
                explanation: "号：称呼，叫做。这里用作动词，意为“叫他‘驼’”。",
                hint: "名词作动词用"
            },
            {
                type: "字词解释",
                question: "“甚善，名我固当”中“固”的意思是？",
                options: ["坚固", "本来，确实", "固定", "固然"],
                answer: 1,
                explanation: "固：本来，确实。名我固当：这样称呼我确实恰当。",
                hint: "“本来”的意思"
            },
            {
                type: "字词解释",
                question: "“因舍其名”中“舍”的意思是？",
                options: ["房屋", "舍弃，放弃", "安排", "施舍"],
                answer: 1,
                explanation: "舍：舍弃，放弃。因舍其名：于是放弃了他原来的名字。",
                hint: "“舍弃”的意思"
            },
            {
                type: "字词解释",
                question: "“亦自谓‘橐驼’云”中“谓”的意思是？",
                options: ["说", "称呼，叫作", "认为", "告诉"],
                answer: 1,
                explanation: "谓：称呼，叫作。亦自谓“橐驼”云：也自称为“橐驼”。",
                hint: "“称谓”的“谓”"
            },
            {
                type: "字词解释",
                question: "“其乡曰丰乐乡”中“其”指代的是？",
                options: ["郭橐驼", "长安", "柳树", "作者"],
                answer: 0,
                explanation: "其：他的，指郭橐驼的。其乡：他的家乡。",
                hint: "指代前文提到的人"
            },
            {
                type: "字词解释",
                question: "“在长安西”中的“长安”是今天的哪里？",
                options: ["洛阳", "南京", "西安", "北京"],
                answer: 2,
                explanation: "长安：今陕西西安，唐朝都城。",
                hint: "唐朝的都城"
            }
        ]
    },
    {
        name: "种树之道",
        desc: "种树方法",
        questions: [
            {
                type: "字词解释",
                question: "“凡长安豪富人为观游及卖果者”中“观游”的意思是？",
                options: ["观看游览", "观赏游览的园林", "参观", "游玩"],
                answer: 1,
                explanation: "观游：指观赏游览的园林。这里指建造园林供人游览的富豪。",
                hint: "名词，指园林"
            },
            {
                type: "字词解释",
                question: "“皆争迎取养”中“取养”的意思是？",
                options: ["收养", "接来养活", "培养", "供养"],
                answer: 1,
                explanation: "取养：接来养活（他），指把郭橐驼接来供养，让他种树。",
                hint: "“取”是接来的意思"
            },
            {
                type: "字词解释",
                question: "“视驼所种树”中“视”的意思是？",
                options: ["视力", "看，观察", "视力好", "看待"],
                answer: 1,
                explanation: "视：看，观察。视驼所种树：看郭橐驼种的树。",
                hint: "“看见”的“视”"
            },
            {
                type: "字词解释",
                question: "“或移徙”中“移徙”的意思是？",
                options: ["移动", "迁移，移植", "迁徙", "搬家"],
                answer: 1,
                explanation: "移徙：迁移，移植。指把树移植到别处。",
                hint: "指移植树木"
            },
            {
                type: "字词解释",
                question: "“无不活”前省略的主语是？",
                options: ["郭橐驼", "树", "豪富人", "作者"],
                answer: 1,
                explanation: "省略的主语是“树”。（树）无不活：树没有不成活的。",
                hint: "什么“无不活”？"
            },
            {
                type: "字词解释",
                question: "“且硕茂”中“硕茂”的意思是？",
                options: ["硕果累累", "高大茂盛", "硕大", "茂盛"],
                answer: 1,
                explanation: "硕茂：高大茂盛。且：而且。且硕茂：而且高大茂盛。",
                hint: "“硕”是大的意思，“茂”是茂盛"
            },
            {
                type: "字词解释",
                question: "“早实以蕃”中“实”的词性和意思是？",
                options: ["名词，果实", "动词，结果实", "形容词，实在", "名词，事实"],
                answer: 1,
                explanation: "实：名词作动词，结果实。早实：早早结果实。蕃：多。",
                hint: "名词活用为动词"
            },
            {
                type: "字词解释",
                question: "“他植者虽窥伺效慕”中“窥伺”的意思是？",
                options: ["偷看", "暗中观察", "窥探", "观察"],
                answer: 1,
                explanation: "窥伺：暗中观察。效慕：仿效羡慕。指其他种树的人暗中观察仿效。",
                hint: "“暗中观察”的意思"
            },
            {
                type: "字词解释",
                question: "“莫能如也”中“如”的意思是？",
                options: ["如果", "比得上", "如同", "比如"],
                answer: 1,
                explanation: "如：比得上。莫能如也：没有能比得上他的。",
                hint: "“不如”的“如”"
            },
            {
                type: "理解题",
                question: "“他植者虽窥伺效慕，莫能如也”说明什么？",
                options: [
                    "其他种树的人不想学",
                    "郭橐驼种树技术高超，别人学不来",
                    "其他种树的人视力不好",
                    "郭橐驼不愿意教别人"
                ],
                answer: 1,
                explanation: "说明郭橐驼种树技艺高超，其他人虽然暗中观察仿效，但没有人能比得上他。",
                hint: "“莫能如”是关键"
            }
        ]
    },
    {
        name: "橐驼之术",
        desc: "种树原理",
        questions: [
            {
                type: "字词解释",
                question: "“有问之”中“之”指代的是？",
                options: ["种树的方法", "郭橐驼", "树", "问题"],
                answer: 1,
                explanation: "之：他，指代郭橐驼。有问之：有人问他（关于种树的事）。",
                hint: "指代郭橐驼这个人"
            },
            {
                type: "字词解释",
                question: "“对曰”中“对”的意思是？",
                options: ["对待", "回答", "对面", "正确"],
                answer: 1,
                explanation: "对：回答。对曰：回答说。古代对话常用语。",
                hint: "“回答”的意思"
            },
            {
                type: "字词解释",
                question: "“橐驼非能使木寿且孳也”中“孳”的意思是？",
                options: ["滋生，繁殖", "子孙", "滋养", "繁殖"],
                answer: 0,
                explanation: "孳：滋生，繁殖。这里指树木生长繁衍。寿且孳：活得长久而且繁殖茂盛。",
                hint: "与“滋生”同义"
            },
            {
                type: "字词解释",
                question: "“能顺木之天”中“天”的意思是？",
                options: ["天空", "天性，自然规律", "天然", "天气"],
                answer: 1,
                explanation: "天：天性，自然规律。顺木之天：顺应树木生长的自然规律。",
                hint: "指树木的自然天性"
            },
            {

// ===================== 游戏状态 =====================
let gameState = {
    currentLevel: 0,
    currentQuestion: 0,
    score: 0,
    lives: 3,
    combo: 0,
    maxCombo: 0,
    levelScores: [0, 0, 0, 0],
    levelStars: [0, 0, 0, 0],
    unlockedLevels: [true, false, false, false],
    hintUsed: false
};

// ===================== 界面切换 =====================
function showHome() {
    document.getElementById('homeScreen').style.display = 'block';
    document.getElementById('levelSelect').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'none';
    updateHomeStats();
}

function showLevelSelect() {
    document.getElementById('homeScreen').style.display = 'none';
    document.getElementById('levelSelect').style.display = 'block';
    document.getElementById('gameScreen').style.display = 'none';
    renderLevelGrid();
}

function renderLevelGrid() {
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    const levelNames = ["初识橐驼", "种树之道", "橐驼之术", "治民之理"];
    const levelDescs = ["基础字词", "种树方法", "种树原理", "深层寓意"];
    const levelEmojis = ["🌱", "🌿", "🌳", "🏛️"];

    for (let i = 0; i < 4; i++) {
        const card = document.createElement('div');
        card.className = 'level-card' + (gameState.unlockedLevels[i] ? '' : ' locked');
        const stars = '⭐'.repeat(gameState.levelStars[i]) + '☆'.repeat(3 - gameState.levelStars[i]);
        card.innerHTML = `
            <div class="level-num">${levelEmojis[i]}</div>
            <div style="font-size:1.3em; color:#d4a574; font-weight:bold;">第${i+1}关</div>
            <div class="level-name">${levelNames[i]}</div>
            <div style="font-size:0.8em; color:#8fbc8f;">${levelDescs[i]}</div>
            <div class="level-stars">${gameState.unlockedLevels[i] ? stars : '🔒'}</div>
        `;
        if (gameState.unlockedLevels[i]) {
            card.onclick = () => startLevel(i);
        }
        grid.appendChild(card);
    }
}

function showRules() {
    document.getElementById('rulesModal').style.display = 'flex';
}

function closeRules() {
    document.getElementById('rulesModal').style.display = 'none';
}

function updateHomeStats() {
    const totalStars = gameState.levelStars.reduce((a, b) => a + b, 0);
    const completed = gameState.levelStars.filter(s => s > 0).length;
    const totalScore = gameState.levelScores.reduce((a, b) => a + b, 0);
    document.getElementById('totalStars').textContent = totalStars;
    document.getElementById('completedLevels').textContent = completed;
    document.getElementById('totalScore').textContent = totalScore;
}

// ===================== 游戏逻辑 =====================
function startLevel(levelIndex) {
    gameState.currentLevel = levelIndex;
    gameState.currentQuestion = 0;
    gameState.score = 0;
    gameState.lives = 3;
    gameState.combo = 0;
    gameState.maxCombo = 0;
    gameState.hintUsed = false;

    document.getElementById('homeScreen').style.display = 'none';
    document.getElementById('levelSelect').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    document.getElementById('resultModal').style.display = 'none';

    document.getElementById('levelName').textContent = '第' + (levelIndex + 1) + '关 ' + levels[levelIndex].name;
    document.getElementById('totalQ').textContent = '10';

    loadQuestion();
}

function loadQuestion() {
    const q = levels[gameState.currentLevel].questions[gameState.currentQuestion];
    gameState.hintUsed = false;

    document.getElementById('currentQ').textContent = gameState.currentQuestion + 1;
    document.getElementById('currentScore').textContent = gameState.score;
    document.getElementById('qType').textContent = q.type;
    document.getElementById('questionText').textContent = q.question;
    document.getElementById('hintBtn').style.display = 'inline-block';
    document.getElementById('hintText').style.display = 'none';
    document.getElementById('hintText').textContent = '提示：' + q.hint;
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';

    updateLives();

    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';

    const labels = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.textContent = labels[idx] + '. ' + opt;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
    });
}

function showHint() {
    if (gameState.hintUsed) return;
    gameState.hintUsed = true;
    gameState.score = Math.max(0, gameState.score - 20);
    document.getElementById('currentScore').textContent = gameState.score;
    document.getElementById('hintBtn').style.display = 'none';
    document.getElementById('hintText').style.display = 'block';
}

function selectAnswer(selectedIdx) {
    const q = levels[gameState.currentLevel].questions[gameState.currentQuestion];
    const options = document.querySelectorAll('.option');
    const correct = selectedIdx === q.answer;

    options.forEach((opt, idx) => {
        opt.classList.add('disabled');
        if (idx === q.answer) {
            opt.classList.add('correct');
        } else if (idx === selectedIdx && !correct) {
            opt.classList.add('wrong');
        }
    });

    if (correct) {
        gameState.combo++;
        if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;

        let points = 10;
        if (gameState.combo >= 3) points += 5;
        if (gameState.combo >= 5) points += 5;
        if (!gameState.hintUsed) points += 5;

        gameState.score += points;

        if (gameState.combo >= 3) {
            showCombo(gameState.combo);
        }
    } else {
        gameState.combo = 0;
        gameState.lives--;
        updateLives();
    }

    document.getElementById('currentScore').textContent = gameState.score;
    document.getElementById('explanation').textContent = '【解析】' + q.explanation;
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('hintBtn').style.display = 'none';

    if (gameState.lives <= 0) {
        setTimeout(() => showResult(false), 500);
    }
}

function updateLives() {
    const hearts = '❤️'.repeat(gameState.lives) + '🖤'.repeat(3 - gameState.lives);
    document.getElementById('livesDisplay').textContent = hearts;
}

function showCombo(n) {
    const el = document.getElementById('comboDisplay');
    el.textContent = '🔥 ' + n + '连击!';
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 800);
}

function nextQuestion() {
    gameState.currentQuestion++;
    if (gameState.currentQuestion >= 10) {
        showResult(true);
    } else {
        loadQuestion();
    }
}

function showResult(completed) {
    const modal = document.getElementById('resultModal');
    const title = document.getElementById('modalTitle');
    const scoreEl = document.getElementById('modalScore');
    const starsEl = document.getElementById('modalStars');
    const msgEl = document.getElementById('modalMsg');

    let stars = 0;
    if (gameState.score >= 90) stars = 3;
    else if (gameState.score >= 70) stars = 2;
    else if (gameState.score >= 50) stars = 1;

    if (!completed) {
        title.textContent = '挑战失败';
        msgEl.textContent = '生命耗尽，再试一次吧！';
        stars = 0;
    } else {
        title.textContent = '第' + (gameState.currentLevel + 1) + '关完成!';
        const messages = ['继续加油!', '干得漂亮!', '太厉害了!', '完美通关!'];
        msgEl.textContent = messages[stars] || '不错!';

        // 保存成绩
        if (gameState.score > gameState.levelScores[gameState.currentLevel]) {
            gameState.levelScores[gameState.currentLevel] = gameState.score;
        }
        if (stars > gameState.levelStars[gameState.currentLevel]) {
            gameState.levelStars[gameState.currentLevel] = stars;
        }

        // 解锁下一关
        if (gameState.currentLevel < 3 && stars > 0) {
            gameState.unlockedLevels[gameState.currentLevel + 1] = true;
        }
    }

    scoreEl.textContent = gameState.score + '分';
    starsEl.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

    modal.style.display = 'flex';
}

function backToLevels() {
    document.getElementById('resultModal').style.display = 'none';
    showLevelSelect();
}

function retryLevel() {
    document.getElementById('resultModal').style.display = 'none';
    startLevel(gameState.currentLevel);
}

function confirmQuit() {
    if (confirm('确定要退出当前关卡吗？进度将不会保存。')) {
        showLevelSelect();
    }
}

// 初始化
showHome();
</script>
